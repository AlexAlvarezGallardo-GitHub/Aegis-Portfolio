name: Docs Drift

# Fails when the portfolio's public claims diverge from the canonical
# platform-registry.json in the Aegis repository (single source of truth).

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/check-alignment.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alignment-check:
    name: Portfolio vs registry alignment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run alignment check
        run: node scripts/check-alignment.mjs
